name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10 
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          
      - name: Install package + dev deps
        run: uv pip install --system -e ".[dev]" duckdb chandra-ocr

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Format check (ruff)
        run: ruff format --check src tests scripts

      - name: Type check (mypy)
        run: mypy src
        continue-on-error: true  

      - name: Pytest
        run: pytest -q --cov=scirex --cov-report=term-missing --cov-report=xml