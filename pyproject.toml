[project]
name = "scirex"
version = "0.1.0"
description = "A PDF-to-markdown scientific-knowledge pipeline with OCR benchmarking."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Julien Pigeon" },
]

# NOTE: torch is intentionally NOT listed. The NGC container provides an
# NVIDIA-patched build for Blackwell (sm_120); letting pip/uv install torch
# from PyPI would overwrite it with a build that may not work on RTX 50-series.
dependencies = [
    "numpy<2",
    "requests",
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "tqdm",
    "rich",
    "loguru",
    "pandas",
    "duckdb",
    "pypdfium2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "ipykernel",
    "jupyter",
]
training = [
    "wandb",
]
ocr = [
    "pillow",
    "opencv-python-headless",
]
demo = [
    "streamlit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scirex"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]